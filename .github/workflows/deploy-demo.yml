name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - demo

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write   # peaceiris/actions-gh-pages needs write to push gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore "Prior Authorization Workflow Tracker/Prior Authorization Workflow Tracker.csproj"

      - name: Publish Blazor WASM (Release, with Brotli compression)
        run: |
          dotnet publish "Prior Authorization Workflow Tracker/Prior Authorization Workflow Tracker.csproj" \
            --configuration Release \
            --output publish \
            -p:CompressionEnabled=true

      - name: Copy 404.html for SPA routing
        run: cp publish/wwwroot/404.html publish/wwwroot/404.html || true

      # GitHub Pages ignores folders that start with _ by default (Jekyll).
      # The .nojekyll file disables that so _framework/ is served correctly.
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish/wwwroot
          # Force-push so the branch stays clean (no history bloat)
          force_orphan: true
          # Preserve .nojekyll across deploys
          keep_files: false
