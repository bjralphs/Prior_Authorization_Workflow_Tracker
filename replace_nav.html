<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PA Tracker Envelope Sidebar</title>

  <style>
    :root {
      --ink: #2a241b;
      --ink-soft: rgba(42, 36, 27, 0.92);

      --paper-fiber-dark: rgba(100, 66, 20, 0.10);
      --paper-fiber-mid: rgba(122, 81, 24, 0.06);
      --paper-dot-dark: rgba(86, 55, 16, 0.16);
      --paper-dot-light: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 55% 38%, rgba(255,255,255,0.95) 0%, transparent 42%),
        linear-gradient(135deg, #f4f1ea 0%, #e7dfd1 48%, #d6c8b4 100%);
      font-family: "Trebuchet MS", "Arial Narrow", Arial, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .demo {
      display: flex;
      padding: 32px 76px 32px 32px;
    }

    .sidebar::before,
    .header-envelope::before,
    .folder-envelope::before,
    .color-sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(var(--paper-dot-dark) 0.45px, transparent 0.75px),
        radial-gradient(var(--paper-dot-light) 0.45px, transparent 0.75px),
        repeating-linear-gradient(
          8deg,
          transparent 0 5px,
          var(--paper-fiber-mid) 5px 6px,
          transparent 6px 12px
        ),
        repeating-linear-gradient(
          97deg,
          transparent 0 6px,
          var(--paper-fiber-dark) 6px 7px,
          transparent 7px 14px
        ),
        linear-gradient(
          180deg,
          rgba(255,255,255,0.05),
          rgba(102,67,20,0.05)
        );
      background-size:
        8px 8px,
        14px 14px,
        100% 100%,
        100% 100%,
        100% 100%;
      background-position:
        0 0,
        5px 6px,
        0 0,
        0 0,
        0 0;
      opacity: 0.34;
      mix-blend-mode: multiply;
    }

    .sidebar {
      width: 430px;
      min-height: 930px;
      position: relative;
      padding: 20px 18px 30px;
      border-radius: 30px;
      background:
        linear-gradient(145deg, #e8bd63 0%, #d6a04a 52%, #b97c2f 100%);
      box-shadow:
        0 34px 58px rgba(43, 26, 7, 0.30),
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -14px 24px rgba(84, 48, 10, 0.18);

      /*
        Important:
        This allows the colored paper inserts to slide outside the nav menu
        instead of being clipped by the sidebar.
      */
      overflow: visible;

      isolation: isolate;
    }

    .sidebar::before {
      opacity: 0.24;
      border-radius: inherit;
      z-index: 0;
    }

    .sidebar::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 26px;
      border: 1px solid rgba(91, 57, 16, 0.22);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
      pointer-events: none;
      z-index: 1;
    }

    /* =========================================
       HEADER
       ========================================= */

    .header-envelope {
      position: relative;
      z-index: 30;
      height: 180px;
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      background:
        linear-gradient(150deg, #f7e2af 0%, #efcf88 58%, #e0ae58 100%);
      border: 1px solid rgba(103, 66, 22, 0.20);
      box-shadow:
        0 10px 16px rgba(67, 41, 10, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.24),
        inset 0 -7px 10px rgba(84, 50, 10, 0.08);
    }

    .header-envelope::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 12px;
      border: 1px solid rgba(110, 72, 22, 0.10);
      pointer-events: none;
    }

    .header-pocket {
      position: absolute;
      left: -1px;
      right: -1px;
      bottom: -1px;
      height: 58px;
      border-left: 1px solid rgba(103, 66, 22, 0.26);
      border-right: 1px solid rgba(103, 66, 22, 0.26);
      border-bottom: 1px solid rgba(103, 66, 22, 0.26);
      border-top: none;
      border-radius: 0 0 16px 16px;
      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.02),
          rgba(103, 66, 22, 0.05)
        );
      pointer-events: none;
      z-index: 2;
    }

    .header-pocket::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 0;
      height: 1px;
      background: rgba(103, 66, 22, 0.30);
      border-radius: 999px;
    }

    .stamp {
      position: absolute;
      top: 28px;
      left: 26px;
      padding: 18px 34px;
      border: 3px solid rgba(63, 58, 45, 0.76);
      border-radius: 6px;
      transform: rotate(-7deg);
      color: rgba(63, 58, 45, 0.86);
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.65px;
      font-family: Georgia, "Times New Roman", serif;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.14),
        inset 0 0 0 3px rgba(63, 58, 45, 0.10),
        0 1px 0 rgba(255,255,255,0.14);
      z-index: 4;
    }

    .stamp::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid rgba(63, 58, 45, 0.44);
      border-radius: 8px;
      pointer-events: none;
    }

    /* =========================================
       NAV
       ========================================= */

    .nav {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
      z-index: 20;
    }

    .nav-item {
      --accent: #d96c55;
      position: relative;
      height: 122px;
      margin-top: 0;
    }

    .nav-item + .nav-item {
      margin-top: -18px;
    }

    .nav-item:nth-child(1) { z-index: 23; }
    .nav-item:nth-child(2) { z-index: 24; }
    .nav-item:nth-child(3) { z-index: 25; }
    .nav-item:nth-child(4) { z-index: 26; }
    .nav-item:nth-child(5) { z-index: 27; }
    .nav-item:nth-child(6) { z-index: 28; }
    .nav-item:nth-child(7) { z-index: 29; }

    .folder-envelope {
      position: absolute;
      inset: 0;
      height: 116px;
      border-radius: 9px 24px 24px 9px;
      background:
        linear-gradient(150deg, #f7dfaa 0%, #efc674 58%, #dfaa4f 100%);
      box-shadow:
        0 14px 20px rgba(48, 30, 8, 0.24),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -6px 10px rgba(99,58,10,0.11);
      overflow: hidden;
    }

    .color-sheet {
      position: absolute;
      top: 11px;
      left: 7px;
      right: 0;
      height: 174px;
      border-radius: 10px 26px 26px 10px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.08), transparent 36%),
        var(--accent);
      box-shadow:
        0 11px 18px rgba(47, 29, 8, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset -10px 0 16px rgba(0,0,0,0.09);
      overflow: hidden;
      z-index: 2;
      transition:
        transform 220ms cubic-bezier(.2,.8,.2,1),
        box-shadow 220ms cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }

    .nav-item:hover .color-sheet,
    .nav-item:focus-within .color-sheet {
      transform: translateX(36px);
      box-shadow:
        0 17px 24px rgba(47, 29, 8, 0.27),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset -10px 0 16px rgba(0,0,0,0.09);
    }

    .folder-link {
      position: absolute;
      top: 4px;
      left: 30px;
      width: 356px;
      height: 108px;
      display: block;
      text-decoration: none;
      color: var(--ink);
      z-index: 3;
    }

    .folder-link:focus {
      outline: none;
    }

    .folder-svg {
      position: absolute;
      inset: 0;
      width: 356px;
      height: 108px;
      overflow: visible;
      filter: drop-shadow(0 12px 11px rgba(48, 30, 8, 0.22));
    }

    .folder-shape {
      fill: url(#manilaGradient);
      stroke: rgba(120, 76, 23, 0.24);
      stroke-width: 1;
    }

    .folder-highlight {
      fill: none;
      stroke: rgba(255, 255, 255, 0.24);
      stroke-width: 1;
    }

    .folder-bottom-shadow {
      fill: none;
      stroke: rgba(98, 58, 10, 0.12);
      stroke-width: 3;
    }

    .folder-pocket-shadow {
      fill: url(#pocketShadowGradient);
      opacity: 0.75;
    }

    .folder-grain {
      fill: url(#paperGrain);
      opacity: 0.22;
      mix-blend-mode: multiply;
    }

    .nav-content {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 50px 1px 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 54px 0 24px;
      z-index: 5;
      pointer-events: none;
    }

    .icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: var(--accent);
      opacity: 0.96;
      filter:
        drop-shadow(0 1px 0 rgba(255,255,255,0.18))
        drop-shadow(0 1px 1px rgba(60,35,8,0.06));
    }

    .icon svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      width: 1px;
      height: 50px;
      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(105, 69, 25, 0.26),
          transparent
        );
    }

    .label {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "Trebuchet MS", "Arial Narrow", Arial, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--ink-soft);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.10),
        0 0 1px rgba(70,48,18,0.06);
    }

    .dashboard { --accent: #d96c55; }
    .queue { --accent: #2d8f8c; }
    .reports { --accent: #c57a49; }
    .notifications { --accent: #7f9962; }
    .users { --accent: #3d86b8; }
    .audit { --accent: #8060a8; }
    .signout { --accent: #a96479; }

    .nav-item.signout {
      height: 196px;
    }

    .nav-item.signout .folder-envelope {
      height: 196px;
    }

    .nav-item.signout .folder-link {
      top: 4px;
      height: 192px;
    }

    .nav-item.signout .folder-svg {
      height: 192px;
    }

    .nav-item.signout .nav-content {
      top: 0;
      bottom: auto;
      height: 108px;
    }

    @media (max-width: 520px) {
      .demo {
        padding: 16px 60px 16px 16px;
      }

      .sidebar {
        width: 430px;
        max-width: calc(100vw - 80px);
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute; left:-9999px; top:-9999px;">
    <defs>
      <linearGradient id="manilaGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f5dfab" />
        <stop offset="55%" stop-color="#efcc82" />
        <stop offset="100%" stop-color="#e4b460" />
      </linearGradient>

      <linearGradient id="pocketShadowGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="rgba(96,58,12,0)" />
        <stop offset="55%" stop-color="rgba(96,58,12,0.16)" />
        <stop offset="100%" stop-color="rgba(96,58,12,0)" />
      </linearGradient>

      <pattern id="paperGrain" width="9" height="9" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.45" fill="rgba(77,48,15,0.25)" />
        <circle cx="6" cy="5" r="0.35" fill="rgba(255,255,255,0.34)" />
        <circle cx="3" cy="7" r="0.35" fill="rgba(77,48,15,0.14)" />
      </pattern>

      <path
        id="folderFacePath"
        d="M0 8
           Q0 0 8 0
           H314
           C333 0 344 4 344 20
           V31
           C344 39 356 38 356 48
           V108
           H0
           Z"
      />

      <path
        id="folderHighlightPath"
        d="M8 1 H312 C331 1 342 5 342 20"
      />

      <path
        id="folderBottomShadowPath"
        d="M6 106 H350"
      />

      <path
        id="folderPocketShadowPath"
        d="M312 4
           C329 5 340 9 340 20
           V31
           C340 42 352 39 352 48
           V106
           H322
           C326 84 326 25 312 4
           Z"
      />

      <path
        id="folderFacePathTall"
        d="M0 8
           Q0 0 8 0
           H314
           C333 0 344 4 344 20
           V31
           C344 39 356 38 356 48
           V192
           H0
           Z"
      />

      <path
        id="folderBottomShadowPathTall"
        d="M6 190 H350"
      />

      <path
        id="folderPocketShadowPathTall"
        d="M312 4
           C329 5 340 9 340 20
           V31
           C340 42 352 39 352 48
           V190
           H322
           C326 84 326 25 312 4
           Z"
      />
    </defs>
  </svg>

  <main class="demo">
    <aside class="sidebar">
      <div class="header-envelope">
        <div class="stamp">PA Tracker</div>
        <div class="header-pocket"></div>
      </div>

      <ul class="nav">
        <li class="nav-item dashboard">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 108" aria-hidden="true">
              <use href="#folderFacePath" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPath" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPath" class="folder-pocket-shadow"></use>
              <use href="#folderFacePath" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">Dashboard</span>
            </span>
          </a>
        </li>

        <li class="nav-item queue">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 108" aria-hidden="true">
              <use href="#folderFacePath" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPath" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPath" class="folder-pocket-shadow"></use>
              <use href="#folderFacePath" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                  <line x1="8" y1="8" x2="16" y2="8"></line>
                  <line x1="8" y1="12" x2="16" y2="12"></line>
                  <line x1="8" y1="16" x2="13" y2="16"></line>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">Request Queue</span>
            </span>
          </a>
        </li>

        <li class="nav-item reports">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 108" aria-hidden="true">
              <use href="#folderFacePath" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPath" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPath" class="folder-pocket-shadow"></use>
              <use href="#folderFacePath" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <line x1="4" y1="20" x2="20" y2="20"></line>
                  <rect x="5" y="11" width="3" height="7"></rect>
                  <rect x="11" y="7" width="3" height="11"></rect>
                  <rect x="17" y="4" width="3" height="14"></rect>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">Reports</span>
            </span>
          </a>
        </li>

        <li class="nav-item notifications">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 108" aria-hidden="true">
              <use href="#folderFacePath" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPath" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPath" class="folder-pocket-shadow"></use>
              <use href="#folderFacePath" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                  <path d="M10 21h4"></path>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">Notifications</span>
            </span>
          </a>
        </li>

        <li class="nav-item users">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 108" aria-hidden="true">
              <use href="#folderFacePath" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPath" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPath" class="folder-pocket-shadow"></use>
              <use href="#folderFacePath" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="9" cy="8" r="4"></circle>
                  <path d="M2.5 21c1.6-4 4-6 6.5-6s4.9 2 6.5 6"></path>
                  <circle cx="17" cy="9" r="3"></circle>
                  <path d="M16 15c2.5.4 4.3 2.3 5.5 6"></path>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">User Management</span>
            </span>
          </a>
        </li>

        <li class="nav-item audit">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 108" aria-hidden="true">
              <use href="#folderFacePath" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPath" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPath" class="folder-pocket-shadow"></use>
              <use href="#folderFacePath" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <rect x="6" y="4" width="12" height="17" rx="2"></rect>
                  <path d="M9 4a3 3 0 0 1 6 0"></path>
                  <line x1="9" y1="10" x2="15" y2="10"></line>
                  <line x1="9" y1="14" x2="15" y2="14"></line>
                  <line x1="9" y1="18" x2="13" y2="18"></line>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">Audit Log</span>
            </span>
          </a>
        </li>

        <li class="nav-item signout">
          <div class="folder-envelope"></div>
          <div class="color-sheet"></div>
          <a class="folder-link" href="#">
            <svg class="folder-svg" viewBox="0 0 356 192" aria-hidden="true">
              <use href="#folderFacePathTall" class="folder-shape"></use>
              <use href="#folderHighlightPath" class="folder-highlight"></use>
              <use href="#folderBottomShadowPathTall" class="folder-bottom-shadow"></use>
              <use href="#folderPocketShadowPathTall" class="folder-pocket-shadow"></use>
              <use href="#folderFacePathTall" class="folder-grain"></use>
            </svg>
            <span class="nav-content">
              <span class="icon">
                <svg viewBox="0 0 24 24">
                  <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"></path>
                  <path d="M15 8l4 4-4 4"></path>
                  <line x1="19" y1="12" x2="9" y2="12"></line>
                </svg>
              </span>
              <span class="divider"></span>
              <span class="label">Sign Out</span>
            </span>
          </a>
        </li>
      </ul>
    </aside>
  </main>
</body>
</html>
